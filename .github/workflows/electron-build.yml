name: Electron Build

# Every push to main builds installers for all three platforms, so a broken
# package is caught immediately. Only a version tag (v1.2.3) publishes them.
#
# Installers no longer pass through Actions artifact storage at all. That storage
# is metered per billing cycle and is not refunded when the artifacts are
# deleted, so a handful of ~360 MB round-trips exhausted the 2 GB allowance and
# then blocked every upload for the rest of the cycle -- including the release
# round-trip itself, which is why v1.2.5 was tagged but never shipped. Each job
# now uploads its own installers straight onto the release: the same bytes,
# billed as release assets, which that meter does not touch.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: electron-${{ github.ref }}
  # Superseded branch builds are disposable; a release build must never be cancelled.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Created up front, and as a draft: up front so the three platform jobs have
  # something to upload onto without racing each other to create it, and draft so
  # nobody sees a release carrying only whichever platform finished first.
  create-release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --generate-notes needs history to diff the tag against

      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --draft

  build:
    name: Package (${{ matrix.platform }})
    needs: [create-release]
    # create-release is skipped on every non-tag run, and a bare `needs` would
    # skip the packaging along with it -- losing the breakage check that is the
    # entire point of building on main and on PRs.
    if: ${{ !cancelled() && needs.create-release.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    steps:
      - uses: actions/checkout@v4

      # Vite 8 requires Node 20.19+/22.12+, and Node 20 is past end-of-life; 24 is
      # the Active LTS and matches what the build is developed against.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Keeps installer filenames (…Setup 1.2.3.exe) in step with the tag being
      # released, without needing a version-bump commit before every tag.
      - name: Sync package version to tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Build web bundle
        run: npm run build

      - name: Package with electron-builder
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          # No signing certificates are configured; stop electron-builder from
          # hunting for a macOS identity and failing the build over it.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Straight onto the draft release. The empty-glob check replaces the
      # if-no-files-found: error this step used to get from upload-artifact, and
      # --clobber lets a re-run of one failed platform replace its own assets
      # instead of erroring on the ones it uploaded before dying.
      - name: Upload installers to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release/*.exe release/*.dmg release/*.AppImage release/*.deb)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::electron-builder produced no installers for ${{ matrix.platform }}"
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --clobber

  # Undrafted only once all three platforms have uploaded, so the release is
  # complete the moment it becomes visible. If any platform fails it stays a
  # draft, which is the right thing to leave behind.
  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --draft=false
