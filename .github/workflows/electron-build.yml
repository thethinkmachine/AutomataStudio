name: Electron Build

# Every push to main builds installers for all three platforms, so a broken
# package is caught immediately. Only a version tag (v1.2.3) publishes them.
#
# Installers no longer pass through Actions artifact storage at all. That storage
# is metered per billing cycle and is not refunded when the artifacts are
# deleted, so a handful of ~360 MB round-trips exhausted the 2 GB allowance and
# then blocked every upload for the rest of the cycle -- including the release
# round-trip itself, which is why v1.2.5 was tagged but never shipped. Each job
# now uploads its own installers straight onto the release: the same bytes,
# billed as release assets, which that meter does not touch.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: electron-${{ github.ref }}
  # Superseded branch builds are disposable; a release build must never be cancelled.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Created up front, and as a draft: up front so the three platform jobs have
  # something to upload onto without racing each other to create it, and draft so
  # nobody sees a release carrying only whichever platform finished first.
  create-release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --generate-notes needs history to diff the tag against

      # Before anything is built: the tag has to name the version the repository
      # states, in package.json and in the citations. `npm version x.y.z` makes
      # the commit and the tag together, so this only fails for a tag made by
      # hand -- the way the tags once reached v3.1.3 while the repository, the
      # website's About and the README's citation all still said 2.9.0.
      - name: Check the tag matches the repository's version
        run: node scripts/sync-version.mjs --check --expect "${GITHUB_REF_NAME#v}"

      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --draft

  build:
    name: Package (${{ matrix.platform }})
    needs: [create-release]
    # create-release is skipped on every non-tag run, and a bare `needs` would
    # skip the packaging along with it -- losing the breakage check that is the
    # entire point of building on main and on PRs.
    if: ${{ !cancelled() && needs.create-release.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    steps:
      - uses: actions/checkout@v4

      # Vite 8 requires Node 20.19+/22.12+, and Node 20 is past end-of-life; 24 is
      # the Active LTS and matches what the build is developed against.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build web bundle
        run: npm run build

      # The command line ships inside the app (dist-cli/, unpacked from the
      # asar), run by the app's own executable through resources/cli/automata.
      - name: Build command-line bundle
        run: npm run cli:build

      - name: Package with electron-builder
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          # No signing certificates are configured; stop electron-builder from
          # hunting for a macOS identity and failing the build over it.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # The installers put the `automata` command line on PATH: the Windows one
      # adds resources\cli to the user's PATH (build/installer.nsh), the .deb
      # links /usr/local/bin/automata (build/linux/after-install.sh). Each is
      # checked on the real package — installed, run from PATH, uninstalled, and
      # checked gone — because a mistake in either only shows on a real install.
      - name: "Installed, automata is on PATH (Windows)"
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $setup = Get-ChildItem release\*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $install = Join-Path $env:LOCALAPPDATA 'Programs\AutomataStudio'
          $dir = Join-Path $install 'resources\cli'
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (-not (($userPath -split ';') -contains $dir)) { throw "The user PATH does not hold $dir`n$userPath" }
          $env:Path = "$userPath;$env:Path"
          automata --version
          if ($LASTEXITCODE -ne 0) { throw "automata --version exited $LASTEXITCODE" }
          automata run js/examples/dfa.json 101 0
          if ($LASTEXITCODE -ne 0) { throw "automata run exited $LASTEXITCODE" }
          # The uninstaller copies itself away and relaunches, so -Wait returns
          # early; wait for the folder to go instead.
          $uninstaller = Get-ChildItem $install -Filter 'Uninstall*.exe' | Select-Object -First 1
          Start-Process $uninstaller.FullName -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 90 -and (Test-Path $dir); $i++) { Start-Sleep 1 }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -contains $dir) { throw "Uninstalling left $dir on the user PATH" }

      - name: "Installed, automata is on PATH (Linux .deb)"
        if: matrix.platform == 'linux'
        run: |
          deb=$(ls release/*.deb | head -1)
          sudo apt-get install -y "./$deb"
          command -v automata
          automata --version
          automata run js/examples/dfa.json 101 0
          sudo apt-get remove -y "$(dpkg-deb -f "$deb" Package)"
          if [ -e /usr/local/bin/automata ] || [ -L /usr/local/bin/automata ]; then
            echo "::error::removing the package left /usr/local/bin/automata"; exit 1
          fi

      # macOS has no install step to hook (a .dmg is drag and drop); the app
      # menu's "Install 'automata' Command in PATH" makes the link. What can be
      # checked here is that the launcher finds the app through a chain of links.
      - name: "The launcher works through a symlink (macOS)"
        if: matrix.platform == 'mac'
        run: |
          app=$(find release -maxdepth 2 -name 'AutomataStudio.app' -type d | head -1)
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/bin2"
          ln -s "$PWD/$app/Contents/Resources/cli/automata" "$RUNNER_TEMP/bin/automata"
          ln -s ../bin/automata "$RUNNER_TEMP/bin2/automata"
          "$RUNNER_TEMP/bin2/automata" --version
          "$RUNNER_TEMP/bin2/automata" run js/examples/dfa.json 101 0

      # Straight onto the draft release. The empty-glob check replaces the
      # if-no-files-found: error this step used to get from upload-artifact, and
      # --clobber lets a re-run of one failed platform replace its own assets
      # instead of erroring on the ones it uploaded before dying.
      #
      # latest*.yml and the blockmaps are what electron-updater reads: the manifest
      # is how an installed copy discovers there is a newer version at all, and the
      # blockmap is what lets it fetch only the changed chunks. They are globbed
      # separately from the installer check, which has to stay a check for
      # *installers* -- a build that emitted only a manifest is still a failed build,
      # and one that advertises an installer it did not upload is worse than useless.
      # (release/ also holds builder-effective-config.yaml and builder-debug.yml,
      # which latest*.yml misses on both counts.) Only win and linux match: mac sets
      # publish to null.
      #
      # This uploads by on-disk filename, which is why package.json pins a space-free
      # artifactName for nsis and appImage. electron-builder's own publisher renames
      # assets to a "safe" form -- spaces to hyphens -- and writes that form into
      # latest.yml, which is also what electron-updater asks GitHub for. gh does not
      # rename; GitHub converts spaces in an asset name to dots instead. So a default
      # "AutomataStudio Setup 1.5.0.exe" lands as "AutomataStudio.Setup…" and
      # is fetched as "AutomataStudio-Setup…", and every update 404s while the
      # release page looks perfectly fine. A name with no spaces is identical under all
      # three rules.
      - name: Upload installers to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          installers=(release/*.exe release/*.dmg release/*.AppImage release/*.deb)
          if [ ${#installers[@]} -eq 0 ]; then
            echo "::error::electron-builder produced no installers for ${{ matrix.platform }}"
            exit 1
          fi
          files=("${installers[@]}" release/latest*.yml release/*.blockmap)
          printf '%s\n' "${files[@]}"
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --clobber

  # Undrafted only once all three platforms have uploaded, so the release is
  # complete the moment it becomes visible. If any platform fails it stays a
  # draft, which is the right thing to leave behind.
  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --draft=false
